name: NFL Weekly Automation

# ---------------------------------------------------------------------
# Schedule: every Friday at 18:00 America/Los_Angeles.
#
# GitHub Actions supports an IANA `timezone` field on cron schedules
# (added in the late-March 2026 Actions update), so daylight-saving
# changes are handled natively - no UTC conversion, no dual-cron
# workaround.
#
# Note: GitHub runs `schedule:` triggers on shared infrastructure, and
# the actual start can lag the scheduled minute - during peak load by
# 15 minutes to 2+ hours. Treat 18:00 as a target, not a hard deadline.
# Scheduled workflows are also disabled automatically in repositories
# with no activity for 60 days; a commit or a manual run re-enables them.
# ---------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season override (leave blank to auto-detect). Use with week."
        required: false
        type: string
      week:
        description: "Week override (leave blank to auto-detect). Use with season."
        required: false
        type: string
      retrain:
        description: "Force model retraining"
        required: false
        type: boolean
        default: false
      include_completed:
        description: "Project games that already kicked off (historical reruns)"
        required: false
        type: boolean
        default: false
      skip_google:
        description: "Skip Drive upload and Sheet update (analytics only)"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "0 18 * * 5"
      timezone: "America/Los_Angeles"

# Never let two runs publish to the same Sheet at once.
concurrency:
  group: nfl-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-weekly-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build run arguments
        id: args
        run: |
          set -euo pipefail
          ARGS=""
          SEASON="${{ inputs.season }}"
          WEEK="${{ inputs.week }}"
          if [ -n "$SEASON" ] && [ -n "$WEEK" ]; then
            ARGS="$ARGS --season $SEASON --week $WEEK"
          elif [ -n "$SEASON" ] || [ -n "$WEEK" ]; then
            echo "::error::season and week must be supplied together."
            exit 1
          fi
          [ "${{ inputs.retrain }}" = "true" ] && ARGS="$ARGS --retrain"
          [ "${{ inputs.include_completed }}" = "true" ] && ARGS="$ARGS --include-completed"
          [ "${{ inputs.skip_google }}" = "true" ] && ARGS="$ARGS --skip-google"
          echo "Runner arguments:$ARGS"
          echo "value=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Run weekly workflow
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TRAILING_GAMES_N: ${{ vars.TRAILING_GAMES_N || '5' }}
          TRAINING_START_SEASON: ${{ vars.TRAINING_START_SEASON || '2021' }}
          RETRAIN_EVERY_WEEKS: ${{ vars.RETRAIN_EVERY_WEEKS || '4' }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}
        run: python weekly_runner.py ${{ steps.args.outputs.value }}

      # Runs even when the step above failed, so a Google outage still
      # leaves the analytics downloadable from the run page.
      - name: Upload CSV outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-outputs-${{ github.run_number }}
          path: |
            outputs/**
            models/model_metadata.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-logs-${{ github.run_number }}
          path: logs/**
          if-no-files-found: ignore
          retention-days: 30
