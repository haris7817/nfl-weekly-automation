name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # The suite runs entirely on synthetic data - no network, no Google
      # credentials - so it is safe on pull requests from forks.
      - name: Run tests
        run: pytest -q

      - name: Check that no secret files are tracked
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|credentials\.json|token\.json|client_secret.*\.json|.*service-account.*\.json)'; then
            echo "::error::A credential file is tracked in git. Remove it and rotate the secret."
            exit 1
          fi
          echo "No credential files are tracked."
